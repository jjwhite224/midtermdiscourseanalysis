name: Collect and publish aggregate comment analysis
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Comments per video (1–200)'
        required: true
        default: '150'
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API key is configured
        run: test -n "$YOUTUBE_API_KEY" || (echo 'Missing secret YOUTUBE_API_KEY' && exit 1)
      - name: Install analysis package
        run: python -m pip install -r requirements.txt
      - name: Collect published-time-bounded comments
        env:
          TARGET: ${{ inputs.target }}
        run: python scripts/collect.py --target "$TARGET"
      - name: Generate aggregate text and cluster summaries
        run: python scripts/analyze.py
      - name: Commit only public aggregates and reviewed selection metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json data/collection_report.json data/resolved_videos.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh aggregate election discourse results'
            git push
          fi
      - name: Summary
        run: |
          echo 'Aggregate result published to data/summary.json' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw comment text stays on this temporary runner and is not committed.' >> "$GITHUB_STEP_SUMMARY"
